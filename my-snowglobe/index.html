<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My First Snowglobe</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header class="hero">
            <h1>Welcome to My First Snowglobe</h1>
            <p>Shake it up for a little winter kindness!</p>
        </header>
        <main>
            <section class="globe-card">
                <div class="globe" id="globe">
                    <img class="scene" src="snowglobe.png" alt="a snowglobe">
                </div>
                <button id="shake">Shake the Globe</button>
                <p class="message" id="message">Press the Button!</p>
            </section>
        </main>
        <footer>
            <p>Made by me, for me.. with me??</p>
        </footer>
    </body>
</html>
